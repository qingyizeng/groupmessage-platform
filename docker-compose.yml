services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gmp
      POSTGRES_PASSWORD: gmp
      POSTGRES_DB: gmp
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmp -d gmp"]
      interval: 2s
      timeout: 3s
      retries: 30

  mock-gateway:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:latest}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: gmp-app:latest
    command: pnpm --filter @gmp/mock-gateway start
    environment:
      PORT: 4001
      PUBLIC_URL: http://mock-gateway:4001
      MOCK_TIMINGS: ${MOCK_TIMINGS:-realistic}
    ports:
      - "${GATEWAY_HOST_PORT:-4001}:4001"

  mock-agent:
    image: gmp-app:latest
    command: pnpm --filter @gmp/mock-agent start
    environment:
      PORT: 4002
    ports:
      - "${AGENT_HOST_PORT:-4002}:4002"

  # C2: Claude-backed agent. Start with SERVER_AGENT_URL=http://llm-agent:4003 docker compose --profile llm up.
  llm-agent:
    image: gmp-app:latest
    profiles: ["llm"]
    command: pnpm --filter @gmp/llm-agent start
    environment:
      PORT: 4003
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5}
      LLM_EFFORT: ${LLM_EFFORT:-low}
    ports:
      - "${LLM_AGENT_HOST_PORT:-4003}:4003"

  server:
    image: gmp-app:latest
    command: sh -c "pnpm --filter @gmp/server migrate && pnpm --filter @gmp/server start"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://gmp:gmp@postgres:5432/gmp
      GATEWAY_URL: http://mock-gateway:4001
      # Not ${AGENT_URL}: compose substitutes from the repo .env, whose AGENT_URL is for local dev.
      AGENT_URL: ${SERVER_AGENT_URL:-http://mock-agent:4002}
      JWT_SECRET: change-me-in-production-please-32b
    ports:
      - "${SERVER_HOST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-gateway:
        condition: service_started
      mock-agent:
        condition: service_started

volumes:
  pgdata:
